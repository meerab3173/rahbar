# The ingestion Job (Assignment 03, Part A and F2): ingest -> verify -> update the data
# lake -> update the retrieval sources, then exit. It is the only writer to Chroma
# (ADR 0001); the api never indexes. Its state lives on the datalake PVC, so a re-run on
# an unchanged corpus embeds nothing. Run it again with no redeploy:
#   kubectl create job --from=cronjob/reindex ingest-$(date +%s) -n rahbar     (make ingest)
apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
  labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 3600
  template:
    metadata:
      labels: {app.kubernetes.io/name: indexer, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: indexer
      automountServiceAccountToken: false
      enableServiceLinks: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # Downloads corpus/sources.yaml into /datalake/sources (or does nothing when
        # CORPUS_SOURCE=fixtures). Files already downloaded are kept on the PVC; the
        # verification stage decides what changed.
        - name: fetch-corpus
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["sh", "/app/fetch-corpus.sh"]
          envFrom:
            - configMapRef: {name: rahbar-config}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: datalake, mountPath: /datalake}
            - {name: tmp, mountPath: /tmp}
      containers:
        - name: indexer
          image: rahbar-indexer:dev
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "pipeline.run"]
          envFrom:
            - configMapRef: {name: rahbar-config}
          # Embedding and OCR hold far more memory than serving. Limit from the peak in
          # `kubectl top pods` during a real run (docs/evidence/kubectl-top.txt, Q4).
          resources:
            requests:
              cpu: 250m
              memory: 448Mi
            limits:
              cpu: "2"
              memory: 1088Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: datalake, mountPath: /datalake}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: datalake
          persistentVolumeClaim: {claimName: datalake}
        - name: tmp
          emptyDir: {sizeLimit: 512Mi}
