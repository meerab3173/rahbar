# Every Service is ClusterIP. Chroma and Redis are never NodePort or LoadBalancer;
# only the Ingress is reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata: {name: api, namespace: rahbar, labels: {app.kubernetes.io/name: api}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: api}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata: {name: ui, namespace: rahbar, labels: {app.kubernetes.io/name: ui}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: ui}
  ports:
    - {name: http, port: 8080, targetPort: 8080}
---
apiVersion: v1
kind: Service
metadata: {name: chroma, namespace: rahbar, labels: {app.kubernetes.io/name: chroma}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: chroma}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
# Governing headless Service for the StatefulSet (stable DNS: chroma-0.chroma-headless).
apiVersion: v1
kind: Service
metadata: {name: chroma-headless, namespace: rahbar, labels: {app.kubernetes.io/name: chroma}}
spec:
  type: ClusterIP
  clusterIP: None
  selector: {app.kubernetes.io/name: chroma}
  ports:
    - {name: http, port: 8000, targetPort: 8000}
---
apiVersion: v1
kind: Service
metadata: {name: redis, namespace: rahbar, labels: {app.kubernetes.io/name: redis}}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/name: redis}
  ports:
    - {name: redis, port: 6379, targetPort: 6379}
