# Deny by default, then allow only the paths the architecture needs (section 4.7).
# Calico enforces these on minikube (make cluster starts it with --cni=calico).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: default-deny-all, namespace: rahbar}
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# Every pod may resolve names; without this, default-deny egress also blocks DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: allow-dns, namespace: rahbar}
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
# ui: from the Ingress controller only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: ui-ingress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: ui}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
      ports:
        - {protocol: TCP, port: 8080}
---
# api: from the Ingress controller and the ui.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-ingress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: ingress-nginx}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: ui}
      ports:
        - {protocol: TCP, port: 8000}
---
# api egress: chroma, redis, Ollama on the host (11434) and a hosted LLM (443).
# Ollama's address differs by OS (192.168.49.1 on Linux, 192.168.65.254 on Docker
# Desktop), so the rule is pinned by port, not by IP; tighten it with an ipBlock of
# `minikube ssh "grep host.minikube.internal /etc/hosts"` on your machine.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: api-egress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: api}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: chroma}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: redis}
      ports:
        - {protocol: TCP, port: 6379}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 443}
---
# chroma: from the api and the indexer ONLY. The ui cannot reach it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: chroma-ingress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: chroma}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: api}
        - podSelector:
            matchLabels: {app.kubernetes.io/name: indexer}
      ports:
        - {protocol: TCP, port: 8000}
---
# redis: from the api ONLY.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: redis-ingress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: redis}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: api}
      ports:
        - {protocol: TCP, port: 6379}
---
# indexer egress: chroma, Ollama for embeddings, and the university website (80/443)
# for the corpus fetch in its init container.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: indexer-egress, namespace: rahbar}
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: indexer}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: chroma}
      ports:
        - {protocol: TCP, port: 8000}
    - to:
        - ipBlock: {cidr: 0.0.0.0/0}
      ports:
        - {protocol: TCP, port: 11434}
        - {protocol: TCP, port: 80}
        - {protocol: TCP, port: 443}
