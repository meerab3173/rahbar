# One ServiceAccount per workload; none of them calls the Kubernetes API, so no token is
# mounted (section 4.7, "everything is admin").
apiVersion: v1
kind: ServiceAccount
metadata: {name: api, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: ui, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: chroma, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: redis, namespace: rahbar}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: indexer, namespace: rahbar}
automountServiceAccountToken: false
