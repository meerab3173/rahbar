# Chroma is a StatefulSet, not a Deployment (ARCHITECTURE.md): a stable identity
# (chroma-0) and a PVC per replica from volumeClaimTemplates, kept across restarts and
# rescheduling. A Deployment's pods share one claim or none, and a rollout would briefly
# run two writers against one RWO volume.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels: {app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: rahbar}
spec:
  serviceName: chroma-headless
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: chroma}
  template:
    metadata:
      labels: {app.kubernetes.io/name: chroma, app.kubernetes.io/part-of: rahbar}
    spec:
      serviceAccountName: chroma
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000            # the PVC is writable by the non-root user
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: chroma
          image: chromadb/chroma:1.0.12    # same version as chromadb-client==1.0.12
          imagePullPolicy: IfNotPresent
          ports:
            - {name: http, containerPort: 8000}
          env:
            - {name: ANONYMIZED_TELEMETRY, value: "FALSE"}
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          readinessProbe:
            httpGet: {path: /api/v2/heartbeat, port: 8000}
            periodSeconds: 10
          livenessProbe:
            tcpSocket: {port: 8000}
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
