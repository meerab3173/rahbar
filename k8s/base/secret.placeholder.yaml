# The SHAPE of the Secret, for documentation only. NOT listed in kustomization.yaml:
# applying it would overwrite the real key. Create the real one from the command line:
#   export LLM_API_KEY=...   # never in a file
#   kubectl create secret generic rahbar-secret -n rahbar --from-literal=LLM_API_KEY="$LLM_API_KEY"
# Base64 is encoding, not encryption.
apiVersion: v1
kind: Secret
metadata:
  name: rahbar-secret
  namespace: rahbar
type: Opaque
stringData:
  LLM_API_KEY: REPLACE_ME
