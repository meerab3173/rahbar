      - {source: academic-rules-handbook-jun-2026.pdf, section: "Academic Warning/Probation"}
    expect: "closed"

  - id: s04
    type: paraphrase
    hard: true
    question: Is there a cutoff after which I can no longer drop a subject I enrolled in?
    relevant:
      - {source: academic-rules-handbook-jun-2026.pdf, section: ""}
