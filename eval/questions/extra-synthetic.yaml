# Four extra synthetic questions for Part B (two more abstentions, two hard paraphrases).
# Same format as eval/golden.yaml. Checked by hand by Meerab before use.
questions:
  - id: s01
    type: abstain
    question: What are the opening hours of the campus pharmacy?
    must_abstain: true

  - id: s02
    type: abstain
    question: Which bus routes does the university shuttle cover in Rawalpindi?
